spring.application.name=smart-assessment-ai
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_assessment_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
app.jwt.issuer=${APP_JWT_ISSUER:https://smart-assessment.local}
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
