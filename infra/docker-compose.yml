version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_assessment_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 456838
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_assessment_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 456838
    ports:
      - "8081:8081"
    depends_on:
      - postgres
